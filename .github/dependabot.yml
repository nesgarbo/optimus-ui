version: 2
updates:
    # Check Node.js packages
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
      open-pull-requests-limit: 20
      groups:
          angular:
              patterns:
                  - "@angular/*"
                  - "@angular-devkit/*"
          # These families are pinned together and must be bumped in one PR.
          tiptap:
              patterns:
                  - "@tiptap/*"
          prosemirror:
              patterns:
                  - "prosemirror-*"
          univer:
              patterns:
                  - "@univerjs/*"

    # Check GitHub Actions workflows
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 20
