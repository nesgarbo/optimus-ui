packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/tailwind-playgrounds/*'

shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@openng/icons': ^1.0.0

catalogs:
  angular22:
    "@angular-devkit/build-angular": ^22.2.2
    "@angular/animations": ^22.2.1
    "@angular/build": ^22.2.2
    "@angular/cdk": ^22.2.2
    "@angular/cli": ^22.2.2
    "@angular/common": ^22.2.1
    "@angular/compiler": ^22.2.1
    "@angular/compiler-cli": ^22.2.1
    "@angular/core": ^22.2.1
    "@angular/forms": ^22.2.1
    "@angular/platform-browser": ^22.2.1
    "@angular/platform-browser-dynamic": ^22.2.1
    "@angular/platform-server": ^22.2.1
    "@angular/router": ^22.2.1
    "@angular/ssr": ^22.2.2
    "@angular-eslint/eslint-plugin": ^22.5.0
    "@angular-eslint/eslint-plugin-template": ^22.5.0
    "@angular-eslint/schematics": ^22.5.0
    "@angular-eslint/template-parser": ^22.5.0
    "ng-packagr": ^22.2.4
    "typescript": ^6.0.3

overrides:
  source-map-js: '>=1.2.2'
  postcss-selector-parser: '>=6.1.3'

minimumReleaseAgeExclude:
  - pnpm@11.13.1
  - '@openng/icons@1.0.0'
  - tsdown@0.22.9
  - '@angular/animations@22.2.1'
  - '@angular/common@22.2.1'
  - '@angular/compiler-cli@22.2.1'
  - '@angular/compiler@22.2.1'
  - '@angular/core@22.2.1'
  - '@angular/forms@22.2.1'
  - '@angular/platform-browser-dynamic@22.2.1'
  - '@angular/platform-browser@22.2.1'
  - '@angular/platform-server@22.2.1'
  - '@angular/router@22.2.1'
  - '@cropper/element-canvas@2.3.0'
  - '@cropper/element-crosshair@2.3.0'
  - '@cropper/element-grid@2.3.0'
  - '@cropper/element-handle@2.3.0'
  - '@cropper/element-image@2.3.0'
  - '@cropper/element-selection@2.3.0'
  - '@cropper/element-shade@2.3.0'
  - '@cropper/element-viewer@2.3.0'
  - '@cropper/element@2.3.0'
  - '@cropper/elements@2.3.0'
  - '@cropper/utils@2.3.0'
  - cropperjs@2.3.0
  - '@angular/cdk@22.2.2'
  - lefthook-darwin-arm64@2.2.0
  - lefthook-darwin-x64@2.2.0
  - lefthook-freebsd-arm64@2.2.0
  - lefthook-freebsd-x64@2.2.0
  - lefthook-linux-arm64@2.2.0
  - lefthook-linux-x64@2.2.0
  - lefthook-openbsd-arm64@2.2.0
  - lefthook-openbsd-x64@2.2.0
  - lefthook-windows-arm64@2.2.0
  - lefthook-windows-x64@2.2.0
  - lefthook@2.2.0
