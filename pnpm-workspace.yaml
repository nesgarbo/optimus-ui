packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/tailwind-playgrounds/*'

shamefullyHoist: true

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@openng/icons': ^1.0.0

catalogs:
  angular22:
    "@angular-devkit/build-angular": ^22.1.6
    "@angular/animations": ^22.1.4
    "@angular/build": ^22.1.6
    "@angular/cdk": ^22.1.4
    "@angular/cli": ^22.1.6
    "@angular/common": ^22.1.4
    "@angular/compiler": ^22.1.4
    "@angular/compiler-cli": ^22.1.4
    "@angular/core": ^22.1.4
    "@angular/forms": ^22.1.4
    "@angular/platform-browser": ^22.1.4
    "@angular/platform-browser-dynamic": ^22.1.4
    "@angular/platform-server": ^22.1.4
    "@angular/router": ^22.1.4
    "@angular/ssr": ^22.1.6
    "@angular-eslint/eslint-plugin": ^22.1.0
    "@angular-eslint/eslint-plugin-template": ^22.1.0
    "@angular-eslint/schematics": ^22.1.0
    "@angular-eslint/template-parser": ^22.1.0
    "ng-packagr": ^22.1.1
    "typescript": ^6.0.0

minimumReleaseAgeExclude:
  - pnpm@11.13.1
  - '@openng/icons@1.0.0'
  - tsdown@0.22.9
  - '@angular/animations@22.1.4'
  - '@angular/common@22.1.4'
  - '@angular/compiler-cli@22.1.4'
  - '@angular/compiler@22.1.4'
  - '@angular/core@22.1.4'
  - '@angular/forms@22.1.4'
  - '@angular/platform-browser-dynamic@22.1.4'
  - '@angular/platform-browser@22.1.4'
  - '@angular/platform-server@22.1.4'
  - '@angular/router@22.1.4'
  - '@cropper/element-canvas@2.3.0'
  - '@cropper/element-crosshair@2.3.0'
  - '@cropper/element-grid@2.3.0'
  - '@cropper/element-handle@2.3.0'
  - '@cropper/element-image@2.3.0'
  - '@cropper/element-selection@2.3.0'
  - '@cropper/element-shade@2.3.0'
  - '@cropper/element-viewer@2.3.0'
  - '@cropper/element@2.3.0'
