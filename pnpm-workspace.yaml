packages:
  - 'packages/*'
  - 'apps/*'
  - 'apps/tailwind-playgrounds/*'

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@openng/icons': ^1.0.0
  cross-env: ^10.1.0
  fs-extra: ^11.4.1
  glob: ^13.0.6
  prettier: ^3.9.9
  rimraf: ^6.1.3
  tsdown: ^0.23.0
  typedoc: 0.28.20

catalogs:
  # Runtime libraries shared by `apps/docs` and `packages/optimus-ui` (dev/peer tooling).
  # Pinned exactly on purpose: tiptap and prosemirror must move together.
  libs:
    '@pdf-lib/fontkit': 1.1.1
    '@tiptap/core': 3.31.4
    '@tiptap/extension-image': 3.31.4
    '@tiptap/extension-list': 3.31.4
    '@tiptap/extensions': 3.31.4
    '@tiptap/pm': 3.31.4
    '@tiptap/starter-kit': 3.31.4
    '@tiptap/suggestion': 3.31.4
    '@univerjs/preset-sheets-core': 1.0.3
    '@univerjs/presets': 1.0.3
    chart.js: 4.5.1
    cropperjs: 2.3.0
    maplibre-gl: 6.13.0
    pdf-lib: 1.17.1
    pdfjs-dist: 6.4.299
    prosemirror-commands: 1.7.2
    prosemirror-dropcursor: 1.8.4
    prosemirror-gapcursor: 1.4.1
    prosemirror-history: 1.5.1
    prosemirror-inputrules: 1.5.1
    prosemirror-keymap: 1.2.3
    prosemirror-model: 1.25.12
    prosemirror-schema-list: 1.5.1
    prosemirror-state: 1.4.4
    prosemirror-tables: 1.8.5
    prosemirror-transform: 1.12.2
    prosemirror-view: 1.42.6
    quill: 2.0.3
  angular22:
    "@angular-devkit/build-angular": ^22.2.2
    "@angular/animations": ^22.2.1
    "@angular/build": ^22.2.2
    "@angular/cdk": ^22.2.2
    "@angular/cli": ^22.2.2
    "@angular/common": ^22.2.1
    "@angular/compiler": ^22.2.1
    "@angular/compiler-cli": ^22.2.1
    "@angular/core": ^22.2.1
    "@angular/forms": ^22.2.1
    "@angular/platform-browser": ^22.2.1
    "@angular/platform-browser-dynamic": ^22.2.1
    "@angular/platform-server": ^22.2.1
    "@angular/router": ^22.2.1
    "@angular/ssr": ^22.2.2
    "@angular-eslint/eslint-plugin": ^22.5.0
    "@angular-eslint/eslint-plugin-template": ^22.5.0
    "@angular-eslint/schematics": ^22.5.0
    "@angular-eslint/template-parser": ^22.5.0
    "ng-packagr": ^22.2.4
    "typescript": ^6.0.3

overrides:
  source-map-js: '>=1.2.2'
  postcss-selector-parser: '>=6.1.3'

minimumReleaseAgeExclude:
  - pnpm@11.13.1
  - '@openng/icons@1.0.0'
  - tsdown@0.22.9
  - '@angular/animations@22.2.1'
  - '@angular/common@22.2.1'
  - '@angular/compiler-cli@22.2.1'
  - '@angular/compiler@22.2.1'
  - '@angular/core@22.2.1'
  - '@angular/forms@22.2.1'
  - '@angular/platform-browser-dynamic@22.2.1'
  - '@angular/platform-browser@22.2.1'
  - '@angular/platform-server@22.2.1'
  - '@angular/router@22.2.1'
  - '@cropper/element-canvas@2.3.0'
  - '@cropper/element-crosshair@2.3.0'
  - '@cropper/element-grid@2.3.0'
  - '@cropper/element-handle@2.3.0'
  - '@cropper/element-image@2.3.0'
  - '@cropper/element-selection@2.3.0'
  - '@cropper/element-shade@2.3.0'
  - '@cropper/element-viewer@2.3.0'
  - '@cropper/element@2.3.0'
  - '@cropper/elements@2.3.0'
  - '@cropper/utils@2.3.0'
  - cropperjs@2.3.0
  - '@angular/cdk@22.2.2'
  - lefthook-darwin-arm64@2.2.0
  - lefthook-darwin-x64@2.2.0
  - lefthook-freebsd-arm64@2.2.0
  - lefthook-freebsd-x64@2.2.0
  - lefthook-linux-arm64@2.2.0
  - lefthook-linux-x64@2.2.0
  - lefthook-openbsd-arm64@2.2.0
  - lefthook-openbsd-x64@2.2.0
  - lefthook-windows-arm64@2.2.0
  - lefthook-windows-x64@2.2.0
  - lefthook@2.2.0
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
