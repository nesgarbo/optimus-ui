<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Optimus UI - Angular UI Component Library</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="description" content="Optimus UI is a community-maintained, MIT licensed suite of 80+ accessible Angular UI components." />
        <meta name="color-scheme" content="light dark" />
        <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />

        <!--
            Theme is decided before the first paint: a stored choice wins, otherwise the
            operating system preference. Angular reads the class back when it boots, so
            the page never renders light and then flips to dark.
        -->
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem('optimus-ui-theme');
                    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (dark) {
                        document.documentElement.classList.add('p-dark');
                    }
                } catch (error) {
                    /* private mode or storage disabled — fall back to light */
                }
            })();
        </script>

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Optimus UI" />
        <meta property="og:title" content="Optimus UI - Angular UI Component Library" />
        <meta property="og:description" content="Optimus UI is a community-maintained, MIT licensed suite of 80+ accessible Angular UI components." />
        <meta property="og:url" content="https://optimus.openng.org/" />
        <meta property="og:image" content="https://optimus.openng.org/open-graph-logo.png" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Optimus UI - Angular UI Component Library" />
        <meta name="twitter:description" content="Optimus UI is a community-maintained, MIT licensed suite of 80+ accessible Angular UI components." />
        <meta name="twitter:image" content="https://optimus.openng.org/open-graph-logo.png" />

        <link rel="canonical" href="https://optimus.openng.org/" />

        <!--
            Structured data for the site itself. Per-page titles, descriptions, canonical
            links and Open Graph tags are written by SeoService as the route changes.
        -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@graph": [
                    {
                        "@type": "WebSite",
                        "@id": "https://optimus.openng.org/#website",
                        "url": "https://optimus.openng.org/",
                        "name": "Optimus UI",
                        "description": "A community-maintained, MIT licensed suite of accessible Angular UI components.",
                        "inLanguage": "en",
                        "publisher": { "@id": "https://optimus.openng.org/#openng" }
                    },
                    {
                        "@type": "Organization",
                        "@id": "https://optimus.openng.org/#openng",
                        "name": "OpenNG",
                        "url": "https://openng.org",
                        "logo": "https://optimus.openng.org/logo-icon.svg"
                    },
                    {
                        "@type": "SoftwareSourceCode",
                        "name": "Optimus UI",
                        "description": "80+ accessible, customizable Angular UI components under the MIT license.",
                        "codeRepository": "https://github.com/openng-org/optimus-ui",
                        "programmingLanguage": "TypeScript",
                        "runtimePlatform": "Angular",
                        "license": "https://opensource.org/licenses/MIT",
                        "author": { "@id": "https://optimus.openng.org/#openng" }
                    }
                ]
            }
        </script>
    </head>

    <body>
        <app-root></app-root>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
